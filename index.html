<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f11">
  <meta name="description" content="MASZ TOOLS - Personal Workspace">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>MASZ TOOLS</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="brand"><span>MASZ</span><b>TOOLS</b></div>
        <div class="subtitle">Personal Workspace</div>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Pengaturan">⚙</button>
    </header>

    <main>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="Cari tools..." autocomplete="off">
      </div>

      <section class="hero">
        <div class="hero-copy">
          <div class="greeting" id="greeting">Good evening,</div>
          <h1>Maszaax</h1>
          <p>Semua tools yang kamu butuhkan,<br>di satu tempat.</p>
          <div class="hero-line"></div>
        </div>
        <div class="hero-art">
          <div class="moon"></div>
          <div class="mountain m1"></div>
          <div class="mountain m2"></div>
          <div class="hero-label">SIMPLE TOOLS<br>BETTER DAYS</div>
        </div>
      </section>

      <section class="section-head">
        <h2>Tools</h2>
        <button id="viewAllBtn">Lihat semua <span>→</span></button>
      </section>

      <section id="toolGrid" class="tool-grid"></section>

      <section class="recent-section" id="recentSection">
        <div class="section-head">
          <h2>Terakhir digunakan</h2>
          <button id="recentAllBtn">Lihat semua <span>→</span></button>
        </div>
        <div id="recentList" class="recent-list"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-page="home">
        <span class="nav-icon">⌂</span><span>Home</span>
      </button>
      <button class="nav-item" data-page="tools">
        <span class="nav-icon">▦</span><span>Tools</span>
      </button>
      <button class="nav-item" data-page="profile">
        <span class="nav-icon">♙</span><span>Profile</span>
      </button>
    </nav>
  </div>

  <div id="toolModal" class="modal hidden">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-sheet">
      <div class="modal-head">
        <button id="closeModal" class="icon-btn">×</button>
        <div id="modalTitle">Tool</div>
        <div style="width:40px"></div>
      </div>
      <div id="toolMount"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
